---
- name: Deploy Traefik reverse proxy
  hosts: traefik
  become: true

  tasks:
    - name: Install Docker
      when: install_docker | default(true)
      block:
        - name: Install prerequisite packages
          ansible.builtin.apt:
            name:
              - ca-certificates
              - curl
              - gnupg
            state: present
            update_cache: true

        - name: Add Docker apt repository
          ansible.builtin.deb822_repository:
            name: docker
            types: deb
            uris: https://download.docker.com/linux/ubuntu
            suites: "{{ ansible_distribution_release }}"
            components: stable
            architectures: amd64
            signed_by: https://download.docker.com/linux/ubuntu/gpg

        - name: Install Docker Engine and Compose plugin
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-compose-plugin
            state: present
            update_cache: true

        - name: Ensure Docker is enabled and running
          ansible.builtin.systemd:
            name: docker
            enabled: true
            state: started

    - name: Create deployment directory structure
      ansible.builtin.file:
        path: "{{ deploy_path }}/data"
        state: directory
        mode: "0755"

    - name: Deploy static Traefik configuration
      ansible.builtin.template:
        src: templates/traefik.yml.j2
        dest: "{{ deploy_path }}/data/traefik.yml"
        mode: "0644"
      notify: Restart traefik

    - name: Deploy dynamic Traefik configuration
      ansible.builtin.template:
        src: templates/dynamic_conf.yml.j2
        dest: "{{ deploy_path }}/data/dynamic_conf.yml"
        mode: "0644"
      # No restart needed: providers.file.watch picks this up live.

    - name: Deploy docker-compose file
      ansible.builtin.template:
        src: templates/docker-compose.yml.j2
        dest: "{{ deploy_path }}/docker-compose.yml"
        mode: "0644"

    - name: Ensure acme_letsencrypt.json exists with correct permissions
      ansible.builtin.file:
        path: "{{ deploy_path }}/data/acme_letsencrypt.json"
        state: touch
        mode: "0600"
        modification_time: preserve
        access_time: preserve

    - name: Start the Traefik stack
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ deploy_path }}"
      register: compose_up
      changed_when: "'Running' not in compose_up.stderr"

  handlers:
    - name: Restart traefik
      ansible.builtin.command:
        cmd: docker compose restart traefik
        chdir: "{{ deploy_path }}"
