api:
  dashboard: false

entryPoints:
  web:
    address: ":80"
    http:
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      aliasHeadersStrategy: delete
  # Dedicated entrypoint so LCARS keeps its existing http://krasosu.de:3001/
  # link instead of moving to a subdomain.
  lcars:
    address: ":3001"
    http:
      aliasHeadersStrategy: delete

providers:
  docker:
    exposedByDefault: false
    network: proxy

certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@krasosu.de
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO
